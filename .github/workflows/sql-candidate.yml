name: SQL candidate diagnostic (not a release)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified security tools
        run: ./scripts/install-ci-tools.ps1
      - name: Scan official SQL Server RHEL candidate without executing it
        run: |
          $ErrorActionPreference = 'Stop'
          $image = 'mcr.microsoft.com/mssql/rhel/server:2022-latest@sha256:a28ec29377c9a45f3afe7411c27b75124e3c6dd3e4f5adab930eb4bea2951dcc'
          New-Item -ItemType Directory -Force artifacts/sql-candidate | Out-Null
          trivy image --image-src remote --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --timeout 12m --format json --output artifacts/sql-candidate/trivy-rhel.json $image
          $scanExit = $LASTEXITCODE
          if ($scanExit -notin @(0, 1)) { throw 'The scanner did not complete successfully.' }
          $report = Get-Content artifacts/sql-candidate/trivy-rhel.json -Raw | ConvertFrom-Json
          if (-not $report.SchemaVersion -or -not $report.Results) { throw 'Missing or invalid scan report.' }
          $findings = @($report.Results | ForEach-Object { $_.Vulnerabilities } | Where-Object { $null -ne $_ })
          $summary = [ordered]@{
            purpose = 'diagnostic-only-not-release-authorization'
            image = $image
            sourceCommit = $env:GITHUB_SHA
            scannerExit = $scanExit
            highCriticalOccurrences = $findings.Count
            distinctCves = @($findings.VulnerabilityID | Sort-Object -Unique)
            checkedUtc = [DateTime]::UtcNow.ToString('o')
          }
          $summary | ConvertTo-Json -Depth 5 | Set-Content artifacts/sql-candidate/summary.json -Encoding utf8
          Write-Host "Candidate HIGH/CRITICAL occurrences: $($findings.Count)"
          if ($scanExit -ne 0 -or $findings.Count -gt 0) { throw 'The candidate retains HIGH/CRITICAL findings and cannot replace the required image.' }
      - name: Preserve candidate evidence regardless of findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sql-rhel-candidate-${{ github.run_number }}
          path: artifacts/sql-candidate/
          if-no-files-found: error
          retention-days: 7
